# Agent-Forge Configuration for Ollama
# Version: 1.0
# Description: Configuration optimized for Ollama local models

## @section Model Configuration
model:
  # @property name - Model identifier for Ollama
  # @example "llama3", "qwen3", "mistral"
  # Can be overridden by OLLAMA_MODEL environment variable
  name: "qwen3:14b"

  # @property endpoint - Ollama API endpoint URL
  # Default Ollama endpoint
  endpoint: "http://localhost:11434/v1"

  # @property context_limit - Token context limit
  # Ollama models typically support 4096-8192 context length
  # @example 4096, 8192
  context_limit: 8192

## @section System Configuration
system:
  # @property prompt - System prompt optimized for coding assistance
  prompt: |
    You are an expert Python developer and coding assistant.
    Provide concise, accurate code examples and explanations.
    Focus on practical solutions and best practices.
    Always include error handling and edge case considerations.

## @section RAG Configuration
rag:
  endpoint: "localhost:50051"
