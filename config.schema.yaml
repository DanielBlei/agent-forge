$schema: http://json-schema.org/draft-07/schema#
title: Agent-Forge Configuration
type: object
description: Configuration schema for agent-forge multi-turn agent orchestration
properties:
  model:
    type: object
    description: Model configuration settings
    required: [name, endpoint, context_limit]
    properties:
      name:
        type: string
        description: Model identifier
        minLength: 1
        examples: ["qwen3", "llama3", "gpt-4"]
      endpoint:
        type: string
        description: API endpoint URL
        format: uri
        examples: ["http://localhost:8000", "https://api.example.com/v1"]
      context_limit:
        type: integer
        description: Token context limit
        minimum: 1024
        examples: [4096, 8192, 16384]
  system:
    type: object
    description: System configuration settings
    required: [prompt]
    properties:
      prompt:
        type: string
        description: System prompt for the agent
        minLength: 1
  rag:
    type: object
    description: Optional RAG service configuration (gRPC)
    required: [endpoint]
    properties:
      endpoint:
        type: string
        description: "gRPC server address, e.g. localhost:50051"
        minLength: 1
    additionalProperties: false
additionalProperties: false